# pnpm 11 moved the build-script allowlist out of package.json#pnpm.onlyBuiltDependencies
# (now ignored) into this file. These are the same trusted deps that were approved before.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true
